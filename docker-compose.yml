services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random hexadecimal database password}
    volumes: [data:/var/lib/postgresql/data]
    networks: [storage]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U portfolio"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://portfolio:${POSTGRES_PASSWORD}@db:5432/portfolio
    depends_on:
      db: {condition: service_healthy}
    networks: [edge,storage]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health',timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped
  nginx:
    image: nginx:stable-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: [./infrastructure/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      app: {condition: service_healthy}
    networks:
      edge: {ipv4_address: 172.29.44.3}
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.22
    profiles: [mail]
    ports: ["127.0.0.1:8025:8025"]
    networks: [edge]
networks:
  edge:
    ipam:
      config: [{subnet: 172.29.44.0/24, ip_range: 172.29.44.128/26}]
  storage:
    internal: true
volumes:
  data:
