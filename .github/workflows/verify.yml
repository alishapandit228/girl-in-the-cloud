name: Verify portfolio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt pytest playwright pip-audit
      - run: python -m pytest -q tests/test_app.py
      - working-directory: frontend
        run: npm install --no-fund && npm test && npm run build
      - run: |
          cp .env.example .env
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> .env
          docker compose up -d --build --wait
          curl -fsS http://localhost:8080/api/health
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser.py
        env: {BASE_URL: 'http://localhost:8080'}
      - run: |
          npx --yes lighthouse@12 http://localhost:8080 --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=test-results/lighthouse.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: portfolio-audit, path: test-results/}
      - run: docker compose down
        if: always()
      - name: Audit dependencies
        run: |
          pip-audit -r backend/requirements.txt
          cd frontend && npm audit --omit=dev --audit-level=high
